<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d0806" />
  <meta name="description" content="DEAD WEST - a top-down twin-stick roguelike shooter in a dark occult western." />
  <title>DEAD WEST</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0806; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #game { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; image-rendering: auto; outline: none; }
    /* pre-boot splash (visible until Phaser adds the canvas) */
    #game:empty::before { content: 'DEAD WEST'; position: absolute; left: 0; right: 0; top: 42%; text-align: center; font: 64px Rye, Georgia, serif; color: #e8dcc0; letter-spacing: 4px; text-shadow: 0 4px 0 #8a1c1c; opacity: .8; }
    /* click-to-focus overlay: shown when the window loses focus so keys never silently stop working */
    #focus { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: rgba(13, 8, 6, .72); color: #e8dcc0; font-family: Rye, Georgia, serif; cursor: pointer; text-align: center; }
    #focus.on { display: flex; }
    #focus b { font-weight: normal; font-size: clamp(28px, 6vw, 64px); letter-spacing: 3px; text-shadow: 0 4px 0 #8a1c1c, 0 0 18px #000; animation: blink 1.4s ease-in-out infinite; }
    #focus span { font: clamp(14px, 2vw, 22px) "Special Elite", "Courier New", monospace; color: #d9b071; }
    @keyframes blink { 50% { opacity: .45; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="focus" role="button" tabindex="-1"><b>CLICK TO FOCUS</b><span>the game is paused while the window is not focused</span></div>
  <noscript><p style="color:#e8dcc0;font-family:Georgia,serif;text-align:center">DEAD WEST needs JavaScript.</p></noscript>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Focus handling: when the window loses focus (alt-tab, click into an iframe parent...) show a click-to-focus overlay;
    // a click gives keyboard focus back to the canvas. The game itself auto-pauses on blur (GameScene).
    (function () {
      var f = document.getElementById('focus');
      var armed = false; // only after the page has really been focused once (never flash the overlay on load)
      function canvas() { return document.querySelector('#game canvas'); }
      function show() { if (armed) f.classList.add('on'); }
      function hide() { f.classList.remove('on'); }
      function focusGame() { try { window.focus(); var c = canvas(); if (c) { c.setAttribute('tabindex', '0'); c.focus({ preventScroll: true }); } } catch (e) {} }
      window.addEventListener('focus', function () { armed = true; hide(); });
      window.addEventListener('blur', show);
      document.addEventListener('visibilitychange', function () { if (document.hidden) show(); else if (document.hasFocus()) hide(); });
      ['pointerdown', 'keydown'].forEach(function (t) { window.addEventListener(t, function () { armed = true; }, { capture: true }); });
      if (document.hasFocus()) armed = true;
      f.addEventListener('pointerdown', function (e) { e.preventDefault(); focusGame(); hide(); });
      document.addEventListener('pointerdown', function (e) { if (e.target && e.target.tagName === 'CANVAS') focusGame(); }, true);
    })();
  </script>
</body>
</html>
